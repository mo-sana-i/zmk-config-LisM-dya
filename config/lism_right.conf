# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# RGB LED widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# debuging
#CONFIG_ZMK_LOG_LEVEL_DBG=y

# Charge Indicator feature
CONFIG_CHARGE_INDICATOR=y

# BLE TX power: technical certification 211-220207 (XIAO-nRF52840)
# measured up to ~8.24dBm on LE 1M PHY and passed antenna output power limits
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========================================
# DYA Studio / Central 設定
# ========================================

# ZMK Studio 有効化
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n は設定しないこと。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する。
CONFIG_ZMK_STUDIO=y

# BLE 接続スロット (プロファイル + Peripheral + Studio)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# USB 接続中もバッテリー履歴を記録する
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Settings RPC (アイドル/スリープ設定など)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# 左右間通信 (Split Relay)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# Runtime Input Processor (トラックボール設定を DYA Studio から変更)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# Studio RPC 有効時は必須 (モジュール README: 未設定だと Refresh List で fault)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Runtime Sensor Rotate (エンコーダー設定を DYA Studio から変更)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# 設定の永続化
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
