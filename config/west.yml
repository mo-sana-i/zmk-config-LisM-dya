manifest:
  defaults:
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: 4mplelab
      url-base: https://github.com/4mplelab
  projects:
    # ZMK 本体を cormoran フォーク (DYA Studio 用カスタム RPC 入り) に変更
    # 土台は main+dya (Zephyr 4.1)。モジュール群の現行 main が Zephyr 4.x 前提のため、
    # v0.3 系 (Zephyr 3.5) では Kconfig/CMake の互換問題が続いた (2026-11-26 のビルド #10/#12)。
    # main+dya の Zephyr は現行ファームと同じ v4.1.0+zmk-fixes。
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    # DYA Studio モジュール群 (すべて cormoran)
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    # runtime-input-processor が設定永続化バックエンドとして必要とする
    # 土台が Zephyr 4.1 (main+dya) なので main のまま使える (configdefault / ROM_SECTIONS は 4.x の機能)。
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    # 既存ドライバ/ウィジェット (現行リポから引き継ぎ)
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: main
      # NOTE(phase2): v0.3系 (Zephyr 3.5) でビルドできるか未確認
    - name: zmk-rgbled-widget
      remote: caksoylar
      # main が ZMK main / Zephyr 4.x 追従 (現行ファームと同じ指定)
      revision: main
    - name: zmk-feature-charge-indicator
      remote: 4mplelab
      revision: main
      # NOTE(phase2): v0.3系でビルドできるか未確認
  self:
    path: config
